[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumforge"
version = "0.2.1"
description = "Reproducible scientific computing platform with quantum, lattice QFT and Schwarzschild GR modules"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "sympy==1.14.0",
  "mpmath==1.3.0",
  "pydantic==2.13.5",
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "h5py==3.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
quantumforge-api = "quantumforge.api.app:run"

[tool.setuptools.packages.find]
include = ["quantumforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:quantumforge.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "dist", "backend-dist", "src-tauri", ".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["quantumforge"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = false
explicit_package_bases = true

[tool.coverage.run]
source = ["quantumforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

